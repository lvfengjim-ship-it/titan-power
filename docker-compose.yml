services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: titan_root_change_me
      MYSQL_DATABASE: titan
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptitan_root_change_me"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:titan_root_change_me@mysql:3306/titan
      APP_ID: titan-power
      APP_SECRET: change-me-to-a-long-random-string
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
